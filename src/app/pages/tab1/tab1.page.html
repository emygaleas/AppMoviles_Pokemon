<ion-content *ngIf="pokemon" class="ion-padding">

  <ion-card class="pokemon-card">

    <!-- Imagen -->
    <img [src]="pokemon.sprites.front_default" class="pokemon-img" />

    <!-- Nombre -->
    <ion-card-header>
      <ion-card-title class="title-center" style="color: white;">
        {{ pokemon.name }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <div class="stat-group">
        <!-- Datos básicos -->
        <p><strong>Altura:</strong> {{ pokemon.height / 10 }} m</p>
        <p><strong>Peso:</strong> {{ pokemon.weight / 10 }} kg</p>
        <p><strong>Experiencia:</strong> {{ pokemon.base_experience }}</p>
      </div>
      

      <!-- Tipos -->
      <p><strong>Tipos:</strong></p>
      <ion-chip *ngFor="let type of pokemon.types" [color]="getColor(type.type.name)">
        <ion-label>{{ type.type.name }}</ion-label>
      </ion-chip>

      <!-- Habilidades -->
      <p><strong>Habilidades:</strong></p>
      <ion-chip *ngFor="let ability of pokemon.abilities">
        {{ ability.ability.name }}
      </ion-chip>

      <!-- Estadísticas -->
      <p><strong>Estadísticas:</strong></p>
      <div *ngFor="let stat of pokemon.stats">
        <p>{{ stat.stat.name }}: {{ stat.base_stat }}</p>
        <ion-progress-bar 
          [value]="stat.base_stat / 150">
        </ion-progress-bar>
      </div>

    </ion-card-content>

  </ion-card>

</ion-content>

<ion-spinner *ngIf="loading"></ion-spinner>
